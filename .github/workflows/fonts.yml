name: جلب الخطوط
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fonts
          B=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o fonts/Amiri-Bold.ttf $B/amiri/Amiri-Bold.ttf
          curl -fsSL -o fonts/Amiri-Regular.ttf $B/amiri/Amiri-Regular.ttf
          curl -fsSL -o fonts/IBMPlexSansArabic-Regular.ttf $B/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf
          curl -fsSL -o fonts/IBMPlexSansArabic-SemiBold.ttf $B/ibmplexsansarabic/IBMPlexSansArabic-SemiBold.ttf
          curl -fsSL -o fonts/OFL-Amiri.txt $B/amiri/OFL.txt
          curl -fsSL -o fonts/OFL-IBMPlexSansArabic.txt $B/ibmplexsansarabic/OFL.txt
          ls -la fonts
          git config user.name "taqwim-maroc"; git config user.email "taqwim-maroc@users.noreply.github.com"
          git add fonts && git commit -m "إضافة الخطوط (رخصة OFL) لتعمل دون إنترنت" && git push
